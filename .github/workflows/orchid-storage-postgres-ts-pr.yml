name: orchid-storage-postgres-ts PR

on:
  pull_request:
    branches: [ main ]

jobs:
  pr:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ "22" ]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orchid_test
          POSTGRES_USER: orchid_test
          POSTGRES_PASSWORD: orchid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test Coverage
        run: npm run test:coverage
      - name: Coverage Summary
        if: github.event_name == 'pull_request'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/lcov.info
          badge: true
          format: markdown
          output: both
      - name: Add Coverage PR Comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: code-coverage-results.md
